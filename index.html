<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover
">

<title>Polish Offset Watch</title>

<style>

:root{
--bg:#000;
--card:#141414;
--active:#1e90ff;
--text:#fff;
--sub:#777;
--orange:#ff9c2f;
--green:#63ff63;
}

*{
margin:0;
padding:0;
box-sizing:border-box;

-webkit-user-select:none;
user-select:none;

-webkit-tap-highlight-color:transparent;

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;
}

html,
body{
width:100%;
height:100%;

overflow:hidden;

background:#000;
color:#fff;

touch-action:manipulation;
}

body{
position:fixed;
inset:0;
}

/* ===================== */

.app{

width:100vw;
height:100dvh;

display:flex;
flex-direction:column;

padding:8px;

overflow:hidden;
}

/* ===================== */

.top{

text-align:center;

font-size:13px;
font-weight:700;

color:var(--orange);

margin-top:2px;
margin-bottom:6px;
}

/* ===================== */

.input-area{

display:flex;

gap:6px;

margin-bottom:6px;
}

.input-box{

flex:1;

background:var(--card);

border-radius:16px;

padding:7px 4px;

text-align:center;

border:2px solid transparent;

transition:.08s;
}

.input-box.active{
border-color:var(--active);
}

.label{

font-size:10px;
color:var(--sub);

margin-bottom:1px;
}

.value{

font-size:30px;
font-weight:900;

line-height:1;

font-variant-numeric:tabular-nums;
}

/* ===================== */

.offset-box{

background:#1a1a1a;

border-radius:16px;

padding:7px;

text-align:center;

margin-bottom:8px;

border:2px solid transparent;
}

.offset-box.active{
border-color:var(--active);
}

.offset-label{

font-size:10px;
color:var(--orange);

margin-bottom:1px;
}

.offset-value{

font-size:34px;
font-weight:900;

line-height:1;
}

/* ===================== */
/* 結果改成單行 */
/* ===================== */

.result{

display:flex;
flex-direction:column;

gap:6px;

margin-bottom:10px;
}

.result-row{

display:flex;
justify-content:space-between;
align-items:center;

background:#101010;

padding:12px 16px;

border-radius:16px;
}

.result-name{

font-size:18px;
font-weight:700;

color:#aaa;
}

.result-value{

font-size:34px;
font-weight:900;

line-height:1;

color:var(--green);

font-variant-numeric:tabular-nums;
}

/* ===================== */
/* 按鈕放更大更高 */
/* ===================== */

.buttons{

display:flex;

gap:12px;

margin-top:auto;

padding-bottom:8px;
}

.btn{

flex:1;

height:82px;

border:none;

border-radius:24px;

background:#2b2b2b;

color:#fff;

font-size:46px;
font-weight:900;

transition:.06s;
}

.btn:active{

transform:scale(.95);

background:#3b3b3b;
}

/* ===================== */

.editing{

text-align:center;

font-size:11px;

color:#666;

margin-top:5px;
}

.editing span{

color:#1e90ff;
font-weight:bold;
}

</style>
</head>

<body>

<div class="app">

<div class="top">
拋光補正
</div>

<!-- X Z -->

<div class="input-area">

<div class="input-box active" id="xBox">

<div class="label">
X
</div>

<div class="value" id="xVal">
-37
</div>

</div>

<div class="input-box" id="zBox">

<div class="label">
Z
</div>

<div class="value" id="zVal">
-61
</div>

</div>

</div>

<!-- OFFSET -->

<div class="offset-box" id="offsetBox">

<div class="offset-label">
OFFSET
</div>

<div class="offset-value" id="offsetVal">
239
</div>

</div>

<!-- 結果 -->

<div class="result">

<div class="result-row">

<div class="result-name">
X1
</div>

<div class="result-value" id="x1Val">
-161
</div>

</div>

<div class="result-row">

<div class="result-name">
Z1
</div>

<div class="result-value" id="z1Val">
-265
</div>

</div>

</div>

<!-- 按鈕 -->

<div class="buttons">

<button class="btn" id="minusBtn">
−
</button>

<button class="btn" id="plusBtn">
+
</button>

</div>

<!-- 編輯欄位 -->

<div class="editing">
編輯：
<span id="editingText">
X
</span>
</div>

</div>

<script>

/* ===================== */

let x = -37;
let z = -61;
let offset = 239;

let current = "x";

/* ===================== */

const xVal =
document.getElementById("xVal");

const zVal =
document.getElementById("zVal");

const offsetVal =
document.getElementById("offsetVal");

const x1Val =
document.getElementById("x1Val");

const z1Val =
document.getElementById("z1Val");

const editingText =
document.getElementById("editingText");

/* ===================== */

function updateUI(){

xVal.textContent = x;
zVal.textContent = z;

offsetVal.textContent = offset;

editingText.textContent =
current.toUpperCase();

/* ===== 原始公式 ===== */

const r =
Math.sqrt(
(x * x) +
(z * z)
);

if(r === 0){

x1Val.textContent = 0;
z1Val.textContent = 0;

return;
}

const scale =
(r + offset) / r;

const x1 =
Math.round(x * scale);

const z1 =
Math.round(z * scale);

x1Val.textContent = x1;
z1Val.textContent = z1;

}

/* ===================== */

function clearActive(){

document
.getElementById("xBox")
.classList.remove("active");

document
.getElementById("zBox")
.classList.remove("active");

document
.getElementById("offsetBox")
.classList.remove("active");

}

function selectField(name){

current = name;

clearActive();

if(name === "x"){

document
.getElementById("xBox")
.classList.add("active");

}

if(name === "z"){

document
.getElementById("zBox")
.classList.add("active");

}

if(name === "offset"){

document
.getElementById("offsetBox")
.classList.add("active");

}

}

/* ===================== */

function addValue(v){

if(current === "x"){
x += v;
}

if(current === "z"){
z += v;
}

if(current === "offset"){
offset += v;
}

updateUI();

}

/* ===================== */

document
.getElementById("xBox")
.onclick = ()=>{

selectField("x");

};

document
.getElementById("zBox")
.onclick = ()=>{

selectField("z");

};

document
.getElementById("offsetBox")
.onclick = ()=>{

selectField("offset");

};

/* ===================== */
/* 單擊 ±1 */
/* ===================== */

document
.getElementById("plusBtn")
.addEventListener(
"click",
()=>{

if(!holding){

addValue(1);

}

}
);

document
.getElementById("minusBtn")
.addEventListener(
"click",
()=>{

if(!holding){

addValue(-1);

}

}
);

/* ===================== */
/* 長按 ±10 */
/* ===================== */

let holding = false;

function enableHold(id, delta){

const btn =
document.getElementById(id);

let holdTimer;
let repeatTimer;

btn.addEventListener(
"pointerdown",
()=>{

holding = false;

holdTimer = setTimeout(()=>{

holding = true;

repeatTimer = setInterval(()=>{

addValue(delta * 10);

},70);

},450);

}
);

function stop(){

clearTimeout(holdTimer);
clearInterval(repeatTimer);

setTimeout(()=>{

holding = false;

},50);

}

btn.addEventListener("pointerup",stop);
btn.addEventListener("pointerleave",stop);
btn.addEventListener("pointercancel",stop);

}

enableHold("plusBtn",1);
enableHold("minusBtn",-1);

/* ===================== */
/* 錶框旋轉 */
/* ===================== */

window.addEventListener(
"rotarydetent",
function(e){

const direction =
e.detail.direction;

if(direction === "CW"){

addValue(1);

}else{

addValue(-1);

}

}
);

/* ===================== */

updateUI();

</script>

</body>
</html>
